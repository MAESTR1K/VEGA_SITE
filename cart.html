<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — VEGA PPF</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="фото/logo/logo.png.webp" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">
                <img src="фото/logo/logo.png.webp" alt="logo">

            <nav class="nav" id="mobileNav">

            </nav>
            <a href="cart.html" class="header__cart">
                <i class="fas fa-shopping-cart"></i>

            <button class="burger" id="burgerBtn" aria-label="Меню">

            </button>

    <section class="cart-page">

            <span>Вернуться в каталог</span>

            <span class="section-tag">Корзина</span>
            <h2 class="section-title">Ваша <span class="highlight">корзина</span></h2>

        <div id="cartContainer">

</section>

    <footer class="footer">

            <div class="footer__brand">
                <span class="logo__icon">✦</span>
                <span class="logo__text">VEGA <span class="logo__accent">PPF</span></span>

            </div>
            <nav class="footer__nav">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="cart.html">Корзина</a>
                <a href="register.html">Регистрация</a>
            </nav>
            <div class="footer__contacts">
                <a href="tel:+78005550027">8 (800) 555-00-27</a>
                <a href="mailto:sales@vegappf.com">sales@vegappf.com</a>

    <script src="script.js"></script>
