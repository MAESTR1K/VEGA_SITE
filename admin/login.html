<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку — VEGA PPF</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="../фото/logo/logo.png.webp" type="image/jpeg">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

    <div class="login-box">
        <div class="login-box__logo">
            <span class="logo-mark">VEGA <span class="accent">PPF</span></span>
            <span class="logo-sub">Admin Panel</span>
        </div>

        <h1 class="login-box__title">Вход в админку</h1>
        <p class="login-box__subtitle">Только для администраторов</p>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="admin@vegappf.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                Войти
            </button>
            <div class="login-error" id="loginError"></div>
        </form>

        <div class="login-box__footer">
            <a href="../index.html">← Вернуться на сайт</a>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
